# pipeline.conf — repo-level switches for the shared book pipeline.
# Sourced by .claude/hooks/session-start.sh and .claude/hooks/enforce-main-law.sh.
# Plain shell assignments only (this file is `source`d). Commit your choices.

# ---------------------------------------------------------------------------
# WORKFLOW_LAW — how git is enforced in this repo.
#
#   main-only  (default)  Work happens ONLY on main. The SessionStart hook moves a
#                         session off any stray branch (carrying uncommitted work
#                         across via stash) and deletes it; a PreToolUse guard blocks
#                         branch creation and pull requests.
#   off                   No enforcement. Use branches and PRs like a normal repo.
#
# Forks that prefer a branch/PR workflow should set this to `off`. Nothing else in
# the pipeline depends on it — the agents, gates and tools work either way.
# ---------------------------------------------------------------------------
WORKFLOW_LAW="main-only"

# ---------------------------------------------------------------------------
# AGENT_SOURCE — where the 12 book-* agents installed into ~/.claude/agents come from.
#
#   repo      (default)  Install this repo's own .claude/agents/*.md. Self-contained:
#                        a fork keeps working with no network and no upstream project.
#   upstream             Fetch the original Best Seller Studio agents and rebuild the
#                        four skill-based roles from it. Only useful if you are
#                        deliberately tracking that upstream; it OVERWRITES the local
#                        copies in ~/.claude/agents and drops this repo's improvements.
#
# Note: in Claude Code on the web, only agents COMMITTED to .claude/agents/ are
# dispatchable by name — the registry is built from the clone before hooks run.
# ---------------------------------------------------------------------------
AGENT_SOURCE="repo"

# ---------------------------------------------------------------------------
# INSTALL_GLOBAL_AGENTS — whether the SessionStart hook copies the 12 book-* agents
# into ~/.claude/agents (your account-wide agents directory).
#
#   auto  (default)  Deploy them. They become available in any session, including one
#                    started outside this repo. The repo's own .claude/agents/ is loaded
#                    for this project either way.
#   off              Leave ~/.claude/agents alone. Choose this if you don't want a
#                    project's agents appearing in your other projects.
# ---------------------------------------------------------------------------
INSTALL_GLOBAL_AGENTS="auto"

# Default model for sub-agent dispatches (the pipeline is written for Opus).
# Leave empty to inherit whatever the session already uses.
PIPELINE_MODEL="claude-opus-4-8"

# Sub-agent turn budget. The upstream agents ship with 40, which truncates a full
# chapter write-plus-gate-loop before it can finish.
PIPELINE_MAXTURNS="120"

# ---------------------------------------------------------------------------
# BOOK_FOLDER_LAW — one book, one folder. Enforced by a PreToolUse guard
# (.claude/hooks/enforce-book-folder-law.sh + book_folder_law.py).
#
#   enforced  (default)  Book artifacts (STATE.yaml, foundation.md, outline.md,
#                        voice-dna.md, character-bible.md, ENTITY_STATE.yaml,
#                        premise.md, manuscript chapters) may ONLY be written
#                        inside books/<slug>/ or books/<series>/<book>/, and a
#                        new book folder may only be created by tools/new-book.sh
#                        — never hand-rolled with mkdir/cp. Every book therefore
#                        starts from the same complete, doctor-checked skeleton.
#   off                  No enforcement. The convention still stands; nothing
#                        stops a stray manuscript file landing at the repo root.
#
# Turning this off does not change any agent, gate or tool — only whether the
# guard blocks the call. Keep it enforced unless you have a reason not to.
# ---------------------------------------------------------------------------
BOOK_FOLDER_LAW="enforced"
