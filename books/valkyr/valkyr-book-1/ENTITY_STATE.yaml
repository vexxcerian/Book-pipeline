        - { value: "a face that makes people want to trust him, and he has known that about himself for a very long time", source: "ch-02:p01" }
        - { value: "a firm, warm handshake, 'exactly as calibrated as everything else about him'", source: "ch-02:p05" }
    traits:
      - { trait: "stands when an operator enters the room", source: "ch-02:p03", mutable: false }
      - { trait: "gives power away in small deliberate increments — 'Drop the sir when it's just us'", source: "ch-02:p06", mutable: false }
      - { trait: "says a dead operator's name exactly right — grave without performance, warm without excess", source: "ch-02:p04", mutable: false }
      - { trait: "practised restraint: stops himself before overdoing a condolence", source: "ch-02:p04", mutable: false }
      - { trait: "shows up in person where his rank does not require it (a small cell's first deployment briefing)", source: "ch-02:p73", mutable: true }
      - { trait: "phrases lethal authorizations as permission rather than instruction — 'authorized, not obligated'", source: "ch-03:p02", mutable: false }
      - { trait: "NO verbal tic, deliberately. GATE CONDITION: no line of his may read as a threat, double meaning or knowing aside", source: "character-bible", mutable: false }
    voice_markers:
      ref: "voice-dna.md#jameson / character-bible.md#jameson"
    relationships:
      vexxcerian:
        type: "commanding officer"
        established: "ch-02:p04"
        current_status: "warm, sincere, and entirely unaware he is suspected. Signed the Reyes commendation personally (ch-04:p28)"
      rx:
        type: "killed him personally (series canon); on the page, only a name Rx's voice catches on"
        established: "series-bible"
        current_status: "believes the truth died with Rx"
    location_log:
      - { chapter: 2, location: "the-facility", scene: "briefing room two levels below anything with a name on the door", travel_noted: false }
      - { chapter: 2, location: "the-facility", scene: "the cell's first mission briefing — delivered it himself", travel_noted: false }
      - { chapter: 3, location: "the-facility", scene: "briefing table with a hard-light projection of the jungle world", travel_noted: false }
      - { chapter: 4, location: "off-page", scene: "signature on the cell's commendation", travel_noted: false }
    knowledge:
      - { fact: "that he watched Rx die at close range and personally wrote the report that buried it", learned: "before ch-01", method: "witnessed" }
      - { fact: "Vexx's full file, including the parts most people in the building are not cleared for", learned: "ch-02:p04", method: "discovered" }
      - { fact: "Rx's file — 'I knew your brother's file before I knew yours'", learned: "ch-02:p04", method: "discovered" }
      - { fact: "the cell is the first full cell the rebuilt program has fielded", learned: "ch-02:p74", method: "witnessed" }
      - { fact: "the cell showed judgment and restraint on the Reyes assessment", learned: "ch-04:p28", method: "discovered" }
    does_not_know:
      - fact: "that Rx survived his death as an AI"
        source: "series-bible"
        on_page_support: "ch-05:p37 — 'Richard Jameson slept, as he had for four years, entirely certain that whatever he'd buried in a jungle clearing a lifetime ago had stayed buried. He was wrong. He simply didn't know it yet.'"
        needs_review: true
        review_note: >-
          The drafted prose never states how the commander of the rebuilt program can be unaware
          that his flagship pairing's AI is Rx. Ch.1 p46 and Ch.2 p17 both establish that the
          institution knows exactly who Rx is and treats the Vexx pairing as its proof of
          concept, and Ch.2 p04 has Jameson volunteering that he knew Rx's file first. Canon is
          recorded as canonical; the mechanism is an open author decision, not a prose fact.
      - fact: "that he is suspected by anyone"
        source: "series-bible"
        on_page_support: "ch-04:p40, ch-05:p37"
    arc_notes: "Antagonist across both books. In Book One he is warm, credible and never sinister on the page; all irony belongs to the reader's later knowledge. Falls in Book Two."

