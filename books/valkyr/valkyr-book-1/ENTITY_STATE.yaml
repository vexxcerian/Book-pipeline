        still standing between here and there. Flagged for the writer, not corrected here.
    ch9_11_additions:
      behaviours:
        - { behaviour: "THE SIGNATURE TIC LANDS, clean and unremarkable: 'You've been quiet since I sat down.' / 'Fine', Rx said. Then, at his ordinary speed: 'He's left-handed. Did you know that.' This closes W-05 from the Ch.1-8 audit — the too-quick denial was absent from Ch.6, 7 and 8 and needed one ordinary use before the Ch.13 break", source: "ch-09:p142-p144" }
        - { behaviour: "notices Zeus is left-handed and works with the sheet turned about thirty degrees, 'and it has been driving me up the wall all night'; and that the laminated card on the terminal has been wrong about paging for four years", source: "ch-09:p144-p148" }
        - { behaviour: "reads the evidence-handling schedule off the summons before Vexx gets down the stairs, and tells him what a board looks like ('three people, a table you can't reach across, and a stenographer who hates you personally')", source: "ch-10:p10-p14" }
        - { behaviour: "times Dessen's handwriting at ninety words a minute over twenty-two minutes, and reads a property schedule nobody asks for. 'Nobody wanted it.'", source: "ch-10:p92-p94" }
        - { behaviour: "GOES NEARLY SILENT from the moment the audit-room door opens — i.e. from Jameson's entrance — and stays that way to the end of the scene", source: "ch-10:p278" }
        - { behaviour: "speaks once more at the very end of Ch.10, at ordinary speed, reading the met page and asking 'Why?' — so the Ch.10 silence is scoped to Jameson's presence and does NOT continue past the scene", source: "ch-10:p318" }
        - { behaviour: "ABSENT FROM THE WHOLE OF CH.11 — zero mentions of his name anywhere in the chapter. The coda registers the silence without naming him: 'You've gone quiet,' he said. / 'Nothing came back. The cursor on the pad by the bed went on doing what it did.'", source: "ch-11:p208-p210" }
      knowledge:
        - { fact: "that Vexx typed four letters of a surname they share into an archive field and cleared it. Already recorded; nothing in Ch.9-11 reopens it", learned: "ch-07:p62", method: "witnessed; said 'I didn't see that'" }
      does_not_know_or_does_not_say:
        - "He has never responded, in any chapter, to Goliath's 'Your Rx runs hot' (ch-08:p422) — he was in Vexx's ear for it and said nothing, and Vexx has never raised it with him. The non-reaction is unmarked in Ch.8 and uncollected in Ch.9-11. See CF-23."
      silence_log_2026_10_03: >-
        TRACKED, not forgotten, but thinning. Mentions of Rx by chapter: Ch.1 23, Ch.2 16,
        Ch.3 9, Ch.4 9, Ch.5 5, Ch.6 2 (and the chapter says so: 'Rx did not say anything. He
        had not said anything since the corridor'), Ch.7 11, Ch.8 4 (nothing after p73 —
        including the corridor where Spector's report arrives), Ch.9 2, Ch.10 4, Ch.11 ZERO.
        The Ch.6, Ch.10 and Ch.11 silences are each registered on the page. The Ch.8 silence
        after p73 is NOT. See CF-23.
    arc_notes: "Alive as an AI; the seal is degrading on schedule. Stages 1 and 2 spent in the drafted chapters. He is aware he is carrying something and has told Vexx he is 'working on being ready'."
    arc_notes_ch9_11: >-
      No stage spent in Ch.9, Ch.10 or Ch.11, including the chapter in which Jameson is
      physically present and speaking at length. Nothing legible surfaces; no fact reaches
      Vexx from inside him. The Ch.10 response to Jameson is SILENCE — exactly the Ch.2
      response, with no escalation — which is the correct choice and which also means mere
      proximity has now been spent THREE times. See memory_unlock_ladder.

