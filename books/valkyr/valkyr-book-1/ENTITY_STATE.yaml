conflicts:
  - id: "CF-01"
    status: "RESOLVED"
    resolved: >-
      2026-09-07 — author's decision: the gap is FOUR YEARS. The drafted prose was edited to
      match the locked series canon — 10 edits across ch-01, ch-02 and ch-03: every "four
      months" became "four years", "I've been retired for a year" became "for four years",
      "the first time in a year" became "in years", "muscle memory outlasting a year of
      retirement" became "four years", and Rx's AI had "already been sitting for years"
      rather than weeks. Ch.1's lock was lifted for this change only. The ch-03/ch-05 "four
      years" lines were the correct ones and are untouched.
    severity: "structural"
    field: "timeline.gap_between_rx_death_and_vexx_recruitment"
    canonical_value:
      value: "FOUR MONTHS. 'The second knock came four months to the day' (ch-01:p24), following the KIA notification and the burial; Vexx is in the gray room days later and paired within the week."
      source: "ch-01:p24"
      corroborating: ["ch-01:p23", "ch-01:p38", "ch-01:p45", "ch-02:p07", "ch-02:p51"]
    conflict:
      - value: "FOUR YEARS. 'a door that had been closed for four years had just shifted'"
        source: "ch-03:p58"
        flag: "UNRESOLVED"
      - value: "FOUR YEARS. 'Richard Jameson slept, as he had for four years, entirely certain that whatever he'd buried in a jungle clearing a lifetime ago had stayed buried'"
        source: "ch-05:p37"
        flag: "UNRESOLVED"
      - value: "FOUR YEARS (LOCKED CANON). 'Four-year gap between Rx's death and Vexx's recruitment' — settled decision 2026-09-07; also STATE.yaml guardrail 'four years after Rx's death'"
        source: "series-bible"
        flag: "UNRESOLVED"
    note: >-
      This is the single largest open contradiction in the drafted material. Ch.1's chain
      (last comm -> KIA notification -> empty casket -> four months of grief -> the knock ->
      the gray room) leaves no room for a four-year gap, and Ch.2 measures Vexx's re-entry in
      weeks from the gray room, which puts Ch.5 roughly six to eight months after the gray room
      and roughly a year after Rx's death. Ch.3 and Ch.5 both assert four years, and locked
      series canon requires four years. Not resolved here.
  - id: "CF-02"
    status: "RESOLVED"
    resolved: >-
      2026-09-07 — ch-04's "I documented it in the field" contradicted ch-03's deliberate
      withholding, which is the beat the private investigation grows out of. Changed to "It
      came back in his gear": Vexx's objection survives, and the fragments still reach
      evidence lock with Corwin's kit, which is how he retrieves them from Voss later in
      the same chapter.
    severity: "plot-load-bearing"
    field: "objects.corwins-fragments.documented_in_field_report"
    canonical_value:
      value: "NOT documented. 'He did not document the fragments of proof, still sitting untouched in the operator's gear, not because he intended to hide them, but because some new, unnamed instinct told him that handing every piece of this story to Jameson's desk before he understood it himself was a mistake he wasn't ready to make.'"
      source: "ch-03:p49"
    conflict:
      - value: "DOCUMENTED. Vexx, to the review officer: 'He had fragments. Physical evidence. I documented it in the field.'"
        source: "ch-04:p03"
        flag: "UNRESOLVED"
    note: >-
      Ch.3's deliberate omission is the beat that starts Vexx's private investigation and is
      named as such in outline:ch-03 ('Vexx's first deliberate omission from a report'). Ch.4
      then has him assert the opposite in dialogue, and the review officer's reply ('Which has
      been reviewed and assessed as inconclusive') presumes the fragments reached command. Both
      readings are load-bearing; neither has been altered.
