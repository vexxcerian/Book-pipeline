    knowledge:
      - { fact: "that a second unmarked element, six-plus, was moving to flank the fireteam the cell was assigned to monitor", learned: "ch-05:p04", method: "witnessed" }
      - { fact: "that Vexx suspects something he is not yet telling the cell, and has promised she will be the first to hear it", learned: "ch-05:p16", method: "told_by:vexxcerian" }
      - { fact: "that Vexx's caution is about something other than her competence", learned: "ch-05:p12", method: "told_by:vexxcerian" }
    does_not_know:
      - { fact: "anything about Rx, the fragments, the dog tag, or the name Jameson in connection with them", source: "ch-05:p16" }
    ch9_11_additions:
      behaviours:
        - { behaviour: "ACOUSTICS. Stands with her weight on the foot nearest the stair, in every room, and knows the building by sound: the slack closer that lands twice, Goliath dragging his heel on the sill. 'I don't need to hear the stair. I hear the stair.' With the door open the corridor 'sounds like weather'", source: "ch-11:p10-p20" }
        - { behaviour: "has shut the propped fire door three times in three days and it has been reopened each time; has asked around and the boot 'hasn't got an owner'", source: "ch-11:p32, ch-11:p50" }
        - { behaviour: "DEVICE (hers alone): fact -> ask -> clock, with 'your call' as a weapon. 'What you do with the rest of it is your call.'", source: "ch-11:p192" }
        - { behaviour: "refuses the order and asks for the sentence instead: 'I don't want the door shut because you've ordered it. I want it shut because it's a bad door.' Does not get it until after she has gone", source: "ch-11:p110, ch-11:p202" }
        - { behaviour: "laughs — 'a short unlovely bark of a laugh she was plainly not expecting, that she made no attempt at all to stop' — at 'I'm standing here holding a boot'", source: "ch-11:p140" }
        - { behaviour: "says 'Dead' about a dry corridor 'with an enormous satisfaction she made no attempt to cover'", source: "ch-11:p132" }
        - { behaviour: "closes on an unexplained piece of her own history and does not finish it: transient housing at nineteen, walls that were nothing, a man who laughed once a night, about eleven, never twice, five months. 'There was no rest of it.'", source: "ch-11:p196-p200" }
      knowledge_gained:
        - { fact: "that Vexx pulled the cell's files again after the jungle, all of them, on his own time, unasked", learned: "before ch-11; she states it as fact and he does not deny it", method: "UNSOURCED — the prose never says how she knows. See CF-23" }
        - { fact: "ONE SENTENCE, and it is all she gets: 'One of the jobs we've run wasn't the job we were briefed.' No which one, no who briefed it, no paper — 'Nothing I can give you.' / 'That's a no.'", learned: "ch-11:p166-p184", method: "Vexx told her, deliberately, having carried the sentence for weeks cut down and cut down again" }
      her_reading_of_vexx:
        right_70_percent: >-
          'the machine of it exactly right' (ch-11:p156) — that he has had something since
          before the jungle; that he decided not to bring it to the cell and decided it again
          every week since; that he worked out what each of them would cost him, in order; that
          he pulled the files.
        wrong_30_percent: >-
          THE REASON. She reads it as protecting the cell's deniability — 'you want us able to
          stand in front of a woman with a notebook, say we didn't know, be telling the truth
          when we say it' — and reads the file-pull as finding out which of them goes to
          command first. The narration fixes the real reason in one clause and never says it
          to her: 'the reason for it wrong, the reason for it not on her roster, not on
          anybody's roster these four years.' That is Rx.
        vexx_does_not_correct_it: "ch-11:p156 — 'he kept it where it was, and let her keep the rest.' VERIFIED: no correction anywhere in the chapter."
      outcome: >-
        'That was your one.' Not a threat, an accounting — she will not come back for the rest,
        not in a corridor, not on a net, not after something goes wrong; if it turns out to be
        what she thinks it is she will find out when everybody else does, and she will be
        wherever he has put her. Said 'without heat, which was worse'.
        outline:ch-11 writer warning (a) HELD: it is not resolved.
    arc_notes: "Series canon: alive at the end of Book One; friction with Vexx suspended, not resolved; knows only that he suspects something."
    arc_notes_ch11: >-
      SERIES-BIBLE UPDATE REQUIRED: her 'Knows' cell currently reads 'That Vexx suspects
      something and promised to tell her first.' After Ch.11 she also holds one operational
      claim — that one of the cell's jobs was not the job they were briefed — with no names and
      no evidence, and she has closed her own account of it. Ch.5's promise ('you'll be the
      first to hear it') is explicitly cashed on the page: 'You told me I'd be first.' / 'I
      did.'
      DEVICE BLEED, CH.11, PRE-POLISH — see CF-21: she is given Zeus's 'That's not X. That's
      Y' reframe in the chapter's FIRST LINE, and Vexx's capped term-correction twice.

