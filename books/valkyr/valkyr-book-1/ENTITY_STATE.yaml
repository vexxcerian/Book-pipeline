        needs_review: true
        review_note: >-
          The drafted prose never states how the commander of the rebuilt program can be unaware
          that his flagship pairing's AI is Rx. Ch.1 p46 and Ch.2 p17 both establish that the
          institution knows exactly who Rx is and treats the Vexx pairing as its proof of
          concept, and Ch.2 p04 has Jameson volunteering that he knew Rx's file first. Canon is
          recorded as canonical; the mechanism is an open author decision, not a prose fact.
      - fact: "that he is suspected by anyone"
        source: "series-bible"
        on_page_support: "ch-04:p40, ch-05:p37"
    ch10_additions:
      on_page: "Ch.10 — his first on-page appearance since Ch.4's signed commendation, and the first time he is in a room with Vexx since Ch.3. The book's central Jameson scene."
      behaviours:
        - { behaviour: "arrives unannounced and unsummoned at an Internal Compliance interview, having come from the other end of the building without a coat, with rain on the shoulders of his uniform and his cap in his hand", source: "ch-10:p150-p158" }
        - { behaviour: "interrupts Dessen mid-sentence, then makes her finish it: 'Finish the sentence.' / 'Read me the end of it.'", source: "ch-10:p154-p160" }
        - { behaviour: "EIGHT SECONDS of disproportionate, ugly anger on Vexx's behalf — her work is trivial, the last Compliance finding in the building was about parking, she has never had to decide anything in under a minute", source: "ch-10:p162-p164" }
        - { behaviour: "stops himself and apologises for FOUR specific things, naming which part was temper and which part he chose: 'The first part was temper. The second part I chose.' Including the procedural harm — coming in over a sentence she was entitled to finish, in front of an operator under her questioning — and that he cannot repair it because there is no mechanism", source: "ch-10:p170-p178" }
        - { behaviour: "DEVICE (character-bible, his alone): pre-empts the objection and states it better than the objector. Puts Dessen's case harder than she did — adds the fact she missed, that Vexx drew the material in person off the counter and so shut the last door a third party could have got in by — before dismantling it", source: "ch-10:p200" }
        - { behaviour: "dismantles the recommendation on a fact, not on rank: makes her read the board's DISPOSITION line, which struck the material from the evidentiary record and retained it as property, before Vexx signed anything. 'There was no chain left for him to break by the time he got there. They broke it. He inherited it.'", source: "ch-10:p218-p224" }
        - { behaviour: "concedes the finding that IS real: 'You can find him for a property return that's overdue... you should, because it is. That's a real finding, I won't stand in front of it.'", source: "ch-10:p224" }
        - { behaviour: "THE BAROMETER, first of three planned appearances: 'Pressure's fallen nine points since Tuesday. That much in two days is a front. It'll be in off the water by tonight.' Nobody responds. He says it anyway", source: "ch-10:p240" }
        - { behaviour: "leaves the door standing open and somebody has to get up and shut it. It is Vexx", source: "ch-10:p244" }
        - { behaviour: "'Drop the sir' escalates to 'Richard.' Refuses the thanks: 'Don't thank me. I read a disposition line. That isn't a favor, it's Thursday.'", source: "ch-10:p284-p288" }
        - { behaviour: "waits through Vexx's unfinished sentence about his brother, giving him his whole attention, longer than the silence can comfortably carry — and then does NOT ask again, does not tilt his head, does not say 'are you sure', does not leave a door propped open in his voice for it to come back through later", source: "ch-10:p292-p304" }
        - { behaviour: "the aneroid gauge — his father's, reads light, never set, because if he has it set it stops being his. Goes on talking about how to read a falling glass as the elevator doors take the rest of the sentence", source: "ch-10:p308-p310" }
      knowledge_gained_ch10:
        - { fact: "that Vexx raised and countersigned a release on the Corwin material, drew it in person, never returned it, and has had it in a residence under a lamp since", learned: "ch-10 — he has read Dessen's finding before he walks in", method: "documentary" }
        - { fact: "Dessen's name, file and finding", learned: "ch-10:p158", method: "read them" }
      still_does_not_know:
        - { fact: "that Vexx suspects him, or that the material is being kept as evidence against him. The nearest the chapter comes is a sentence Vexx does not finish", source: "ch-10:p294" }
        - { fact: "that Rx survived. Nothing in Ch.10 touches it. CF-03 remains open and is NOT closed by this chapter", source: "ch-10" }
      gate_condition_verified_2026_10_03: >-
        THE CH.10 GATE CONDITION HOLDS AND IS NOW CANON: no Jameson line in the chapter is
        readable as a threat, a double meaning or a warning WHERE THE SECOND MEANING IS
        AVAILABLE TO HIM. Every second meaning is reader-side only. The three closest lines,
        recorded so a later pass does not strengthen them: (a) 'Then what you have is a
        solitude problem... he was alone in it start to finish, with nothing in the file that
        could have stopped him' — true of Vexx's investigation, but Jameson is arguing
        procedure and cannot know; (b) 'That's the trouble with an honest man in a compliance
        room — he's the only person in it who can be talked out of his own position'; (c) the
        barometer. NOTHING IN CH.11 RETROACTIVELY CONVERTS ANY OF THEM — Ch.11 does not mention
        Jameson, Dessen, the finding or the property return at all. Verified.
        ALSO VERIFIED: he is institutional, never cartoonish. The eight seconds of temper make
        him MORE likeable, not less, because the apology is better than the anger was and he
        itemises his own bad faith. This is the strongest execution of the lock in the book.
    arc_notes: "Antagonist across both books. In Book One he is warm, credible and never sinister on the page; all irony belongs to the reader's later knowledge. Falls in Book Two."

