  schema_extensions:
    # Declared so downstream skills know these are additions to schema v1.0, not core fields.
    - "planned:            top-level block for entities the outline creates but prose has NOT yet put on the page"
    - "secrets:            who-knows-what ledger for the book's asymmetric-knowledge engine"
    - "memory_unlock_ladder: the locked four-stage Rx mechanic, with stages spent/not reached"
    - "objects.*.chain_of_custody: physical-evidence handling chain (required by this book's premise)"
    - "characters.*.on_page / characters.*.importance: prose-presence and priority markers"
  timeline_policy: >-
    RELATIVE ANCHORS ONLY. Series canon forbids pinning an absolute in-universe date to the
    page. Every temporal value in this file is expressed relative to Rx's death, Vexx's
