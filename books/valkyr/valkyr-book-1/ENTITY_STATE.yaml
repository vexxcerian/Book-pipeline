# ============================================================================================
# LOCATIONS
# ============================================================================================
locations:
  the-facility:
    canonical_name: "the facility (unnamed ONI/Valkyr installation)"
    aliases: ["the building", "this building"]
    facts:
      - { fact: "holds the gray room: small, gray, humming with the white noise of server cooling; a single terminal and a soft blue cursor on a black screen", source: "ch-01:p30" }
      - { fact: "briefing rooms two levels below anything with a name on the door, on no building schematic, reached by an elevator requiring a code nobody wrote down", source: "ch-02:p02" }
      - { fact: "Voss's table sits several floors above Jameson's office and is considerably less carefully lit", source: "ch-02:p15" }
      - { fact: "holds a training range Vexx commandeered for the cell's early drills, with an observation deck above it; mock-structure walls scorched black in a dozen places", source: "ch-02:p36" }
      - { fact: "holds assessment rooms, a coffee station, barracks/quarters, an evidence lock, and a common room the cell adopted as its unofficial gathering space", source: "ch-05:p20" }
      - { fact: "instructors there never give their full names", source: "ch-01:p57" }
      - { fact: "gray corridors", source: "ch-02:p09" }
    distances: []
  vexxs-apartment:
    canonical_name: "Vexx's apartment"
    aliases: []
    facts:
      - { fact: "barely unpacked — boxes still taped shut in the corner of an unfurnished living room", source: "ch-01:p25" }
      - { fact: "has a kitchen table; the fragments were spread across it", source: "ch-04:p09" }
      - { fact: "there is a drawer beside his bed holding the dog tag and the data chip", source: "ch-05:p37" }
    distances: []
  unnamed-jungle-world:
    canonical_name: "the jungle world (unnamed)"
    aliases: []
    facts:
      - { fact: "triple-canopy jungle so dense it reads from altitude as a single unbroken green skin across the whole world", source: "ch-03:p07" }
      - { fact: "vines that have to be cut; ground that gives way into sinkholes hidden under decades of leaf litter; constant low static of insect life", source: "ch-03:p25" }
      - { fact: "holds the burned-out clearing where a temporary camp stood, scorched in a pattern too deliberate to be accidental, equipment stripped or destroyed", source: "ch-03:p14" }
      - { fact: "six hours on the trail from the burned camp to where Corwin was found, arriving a little after dusk", source: "ch-03:p25" }
      - { fact: "Corwin was found against a fallen tree", source: "ch-03:p26" }
    distances:
      - { to: "the-facility", value: "dropship + transport; a full flight home, cabin lights dimmed for sleep", source: "ch-03:p51" }
  ruined-agricultural-settlement:
    canonical_name: "the ruined agricultural settlement (unnamed)"
    aliases: []
    facts:
      - { fact: "a small agricultural settlement caught weeks earlier in the crossfire of a Covenant raid", source: "ch-04:p18" }
      - { fact: "has a tree line above it from which the cell observed", source: "ch-04:p22" }
      - { fact: "surviving civilians remained on site and were being questioned by Reyes", source: "ch-04:p18" }
    distances: []
  ruined-industrial-complex:
    canonical_name: "the ruined industrial complex (unnamed)"
    aliases: []
    facts:
      - { fact: "on the edge of a contested zone", source: "ch-05:p03" }
      - { fact: "terrain the second unmarked element folded back into, which Gaia could no longer read cleanly once the window closed", source: "ch-05:p15" }
    distances: []
  goliaths-homeworld:
    canonical_name: "Goliath's homeworld (unnamed colony)"
    aliases: []
    facts:
      - { fact: "a colony under threat when Goliath was a child — pirates or insurrectionists; he was too young to be told which", source: "ch-02:p41" }
      - { fact: "one Spartan ended it clean and quiet and was gone before local news crews got a camera up; nobody in town got a name", source: "ch-02:p41" }
    distances: []
  rx-death-site:
    canonical_name: "the site of Rx's death (unnamed)"
    aliases: []
    facts:
      - { fact: "a jungle clearing — 'whatever he'd buried in a jungle clearing a lifetime ago'", source: "ch-05:p37" }
      - { fact: "Rx's stage-1 leak surfaces a treeline that is not the Corwin treeline and that he has no file for", source: "ch-03:p37" }
      - { fact: "PLANNED (outline:ch-20): the name Rx eventually surfaces for this place is Ashgrove. NOT ON THE PAGE.", source: "outline:ch-20" }
    distances: []
  empty-casket-burial-site:
    canonical_name: "Rx's grave (unnamed)"
    aliases: []
    facts:
      - { fact: "an empty casket buried under protocol for classified KIAs — remains unable to be recovered from the field", source: "ch-01:p22" }
      - { fact: "sun too bright for the occasion; a chaplain speaking about sacrifice and duty", source: "ch-01:p22" }
    distances: []

  rehabilitation-station:
    canonical_name: "the rehabilitation track (unnamed converted agricultural station)"
    aliases: ["the station", "the track", "this building"]
    facts:
      - { fact: "a converted agricultural station on a slope above a river valley; four low buildings, whitewashed within the last year; an orchard on the south side pruned back hard for winter; a track down to a pump house", source: "ch-06:p14" }
      - { fact: "a double row of saplings along the drive, staked and tied, worth nothing as shade for fifteen years", source: "ch-06:p14" }
      - { fact: "gate stands open; the guard post beside it is empty and its step has leaf litter on it; the day-room door is not locked", source: "ch-06:p16" }
      - { fact: "good coffee in a glass pot on a corridor warmer, on the same contract as the district hospital; a bowl of apples with a HELP YOURSELF card; a real plant on the windowsill", source: "ch-06:p20" }
      - { fact: "day room has windows on two sides, a radio at the far end, a card table with a jigsaw; the good chairs were moved to the second floor in April", source: "ch-06:p28" }
      - { fact: "residents' contact lists are taken on admission as standard; family contact is 'reviewed each cycle'", source: "ch-06:p56" }
      - { fact: "three visitors a month permitted. Vexx is the first Corwin has had", source: "ch-06:p60" }
      - { fact: "the visitor sign-out log is retained two years", source: "ch-06:p60" }
      - { fact: "a dog that belongs to nobody comes up from the valley on Tuesdays", source: "ch-06:p66" }
    distances:
      - { to: "the-facility", value: "four hours on a civilian transit line with two changes, the second at a market town; then a walk down to a transit shelter at the bottom of the hill", source: "ch-06:p06" }
    note: "Its DECENCY is the horror. Series/outline constraint: it may never be made sinister, and nothing in Ch.6 makes it so."
  relay-station-plateau:
    canonical_name: "the relay station on the plateau (unnamed)"
    aliases: ["the station", "a weather station"]
    facts:
      - { fact: "top of a long gravel apron on a plateau the colour of wet ash; no cover for eight hundred metres in any direction; wind fast enough to make the mast guys sing", source: "ch-08:p74" }
      - { fact: "four buildings and a mast: a fuel shed, a plant house, an accommodation block, and the relay hall - the only building with a proper door and no window", source: "ch-08:p74" }
      - { fact: "garrison of eleven including Merrick, on a two-man watch rotation; a north shift; a changeover on the sixteenth", source: "ch-08:p90" }
      - { fact: "ground frozen; February is the reference month for both the dark hours and the plate-lifting job", source: "ch-08:p138" }
      - { fact: "the relay hall has a near door (opens out, chained back on the hinge side) and a second door at the far corner; a service corridor two metres wide runs between them", source: "ch-08:p172" }
      - { fact: "the fuel shed holds four drums with four intact seals, a dry bund, and a spanner on the floor", source: "ch-08:p78" }
      - { fact: "the station has adopted and lost and re-adopted a dog", source: "ch-08:p124" }
    distances: []
  kettle-ridge:
    canonical_name: "Kettle"
    aliases: ["the north ridge"]
    facts:
      - { fact: "the ridge on the north side of the relay station. Named by Echo, on the net, for the noise it makes; the name is used by the cell thereafter as if agreed", source: "ch-08:p76" }
      - { fact: "the noise runs about eleven seconds, drops, and comes again", source: "ch-08:p82" }
      - { fact: "Merrick carried a man down off it in October with a broken hip, in four hours", source: "ch-08:p162" }
      - { fact: "the transport out goes through a col beyond it and makes a different noise that nobody names", source: "ch-08:p184" }
    distances: []
    note: "ECHO's device (naming a thing then using the name as if agreed) - correct owner per character-bible TIC BUDGET."
  hallows-bottom:
    canonical_name: "Hallow's Bottom"
    aliases: []
    facts:
      - { fact: "a stop on the civilian transit line out to Corwin's rehabilitation track. Rx reads it off the timetable and tells Vexx he has seen it. Never visited", source: "ch-06:p12" }
    distances: []
    note: "The only proper place name spoken in Ch.1-8. It is a joke on a timetable, not a setting."

# ============================================================================================
# TIMELINE — RELATIVE ANCHORS ONLY. No absolute in-universe date may be pinned (series canon).
# ============================================================================================
timeline:
  - chapter: 1
    time: "spans roughly two years, told retrospectively. Anchors in order: the 0300 incident -> three weeks later, the discharge hearing -> Rx had shipped out three weeks before that -> the last comm -> the KIA notification -> the empty-casket burial -> four months of grief -> 'the second knock came four months to the day' -> the gray room -> first week of forms and briefings -> first month of training -> four weeks after the gray room, told he will help stand up a cell"
    season: "not stated"
    year: "FORBIDDEN — do not pin"
    note: >-
      CONFLICT CF-01 (see conflicts). This chapter places Vexx's recruitment FOUR MONTHS after
      Rx's death. Series canon and Ch.3/Ch.5 place it FOUR YEARS after. Secondary wobble: Rx
      tells Vexx he is rusty four days into training and Vexx answers 'I've been retired for a
      year' (ch-01:p59), which implies roughly eight months between the discharge and the KIA
      notification — a span the chapter never states.
  - chapter: 2
    time: "'three weeks into his own re-entry' = ~3 weeks after the gray room (Jameson meeting) -> the assignment two weeks later -> four days working the shortlist -> Goliath's pairing three days after the interview -> the Phantom slip three weeks after the pairing -> the rest of the roster over the following six weeks -> three days between the last pairing and the first deployment"
    season: "autumn"
    year: "FORBIDDEN — do not pin"
    note: >-
      Season established by 'Like so much else that autumn' (ch-02:p45). Command wanted the cell
      operational 'within the quarter' (ch-02:p15). Retrospective forward-reach: 'He would spend
      the better part of two years finding out how much of that hope had been earned'
      (ch-02:p61) — the narrator's vantage sits at least two years past Ch.2.
      Minor wobble: Spector reads Goliath 'faster than made strict logical sense for six weeks
      of acquaintance' (ch-02:p40) inside a scene the same chapter places three weeks after the
      pairing (ch-02:p36).
  - chapter: 3
    time: "the cell's first deployment, three days after the last pairing. The target had been dark eleven days. Burned camp found by midafternoon; six hours on the trail; Corwin found a little after dusk; extraction that night; report filed from the transport home"
    season: "autumn"
    year: "FORBIDDEN — do not pin"
    note: >-
      'the way he'd been filing everything that autumn' (ch-03:p46). Ch-03:p58 states 'a door
      that had been closed for four years had just shifted' — see CF-01.
  - chapter: 4
    time: "the Corwin debrief 'three weeks after the jungle' -> fragments pulled from evidence lock two days later -> the same night at the kitchen table -> the Reyes mission (the cell's THIRD deployment) six weeks later -> Jameson's signed response three days after that -> the night conversation with Rx that same night"
    season: "autumn (continuing)"
    year: "FORBIDDEN — do not pin"
    note: >-
      Ch.4 is the cell's third deployment; the SECOND deployment is never depicted or dated in
      the drafted material. Gap noted, not filled.
  - chapter: 5
    time: "a monitoring mission after Ch.4 (interval not stated) -> corridor argument the same day -> 'He found Aglaope two nights later'"
    season: "autumn"
    year: "FORBIDDEN — do not pin"
    note: >-
      'the way he'd learned to do more and more often that autumn' (ch-05:p39). Ch-05:p37 states
      Jameson has slept certain 'for four years' — see CF-01. The five drafted chapters cover
      roughly six to eight months from the gray room, all inside a single autumn from Ch.2 on.

  - chapter: 6
    time: "two days' personal leave. Corwin is 'six weeks into a rehabilitation track'; the jungle was 'nine weeks earlier', stated three times. Four hours' transit out, one afternoon in the day room, the transit shelter at the end of it"
    season: "winter (orchard pruned back hard for winter; windfalls rotting in the grass; cold through the window). The clinician refers back to April and to spring as past"
    year: "FORBIDDEN — do not pin"
    note: >-
      CONFLICT CF-08. Ch.4 puts the Reyes mission at jungle+9 weeks and Ch.5 falls after that,
      so a Ch.6 dated at jungle+9 weeks collides with Ch.4 and lands at or before Ch.5 rather
      than after it. Ch.6's own arithmetic is internally clean (debrief at +3 weeks -> rehab
      intake -> six weeks in = +9). The squeeze is between chapters, not inside Ch.6.
  - chapter: 7
    time: "a single night at the kitchen trestle, from a quarter past eleven to a little after two. Explicitly 'two months' after the Ch.4 kitchen-table serial run, which places it after Ch.6"
    season: "autumn/winter. 'He had been at this since the summer' (the furniture listings); the archive subscription lapses at the end of the month"
    year: "FORBIDDEN — do not pin"
    note: >-
      Internal spans: nine minutes in a queue; four five-year date ranges to cover twenty years;
      a nineteen-minute materiel search. Holst dead 'seven years and four months'; his equipment
      issued 'eleven months after the file closed.' Holst's death therefore predates Rx's by
      roughly three years - no conflict with the four-year gap.
  - chapter: 8
    time: "one deployment across two days plus the return: transit -> insertion -> the fuel shed (22 min) -> Merrick in the plant house -> the failed stack at 14:14 -> Zeus's assessment (1h40m) -> the kitchen at 23:00 -> the transport at 06:30 -> the corridor a little after 07:00 -> Goliath at 16:30 -> a 50-minute report. Anchored to Ch.5 by 'a corridor argument seven weeks earlier'"
    season: "deep winter, before February. Merrick refers forward to February twice and to 'before spring'; Ivo rotated out 'at the start of the winter'; Merrick has not slept since October; Tomas has been on the north shift 'since the summer'"
    year: "FORBIDDEN — do not pin"
    note: >-
      CONFLICT CF-07 (deployment number) and CF-09 (the apron head-count). Also carries the
      cell's own elapsed-time markers: 'six weeks of you telling me about scale' (Goliath's
      coffee feud), 'since August' (the urn), 'since the middle of the summer' (Paladin's
      instrument file), and the narrator's 'somewhere in the first year' for the cell's
      cohesion - all consistent with a cell formed the previous late summer/autumn.

# ============================================================================================
# OBJECTS — the physical evidence chain is the spine of this book. Tracked in detail.
# ============================================================================================
objects:
  corwins-fragments:
    introduced: "ch-03:p35"
    description: "The group term for the physical evidence Corwin retained from the ambush: a modified armour plate, a half-melted data chip, and a dented dog tag. Corwin's own summary: 'Enough to know I'm not crazy. Not enough to matter to anyone who could actually do something about it.'"
    status: "chekhov_open"
    last_mentioned: "ch-07:p50"
    resolution: null
    chain_of_custody:
      - { stage: 1, holder: "corwin", where: "in the operator's own gear, in the jungle", source: "ch-03:p49" }
      - { stage: 2, holder: "evidence lock (institution)", where: "the facility", source: "ch-04:p08", note: "reviewed by command and 'assessed as inconclusive' (ch-04:p04)" }
      - { stage: 3, holder: "vexxcerian", where: "released to him two days after the debrief on an authorization tied to his own cell, via a favour from Voss", source: "ch-04:p08" }
      - { stage: 4, holder: "vexxcerian", where: "spread across his kitchen table, alone, that night", source: "ch-04:p09" }
      - { stage: 5, holder: "vexxcerian", where: "a drawer in his apartment / beside his bed", source: "ch-04:p22" }
      - { stage: 6, holder: "vexxcerian", where: "the kitchen trestle, under a lamp, across a night of civilian-archive searching. Vexx's own summary of his exposure: 'an armour fragment nobody had signed back into evidence lock, a tag with a dead man's name stamped on it, a search history across nine civilian archives under his own address, a private tally of every silence his brother had produced since the jungle'", source: "ch-07:p50", note: "The half-melted data chip is NOT named in that inventory. Recorded, not corrected — see CF-12." }
    handled_by: ["corwin", "corwin-review-officer (reviewed)", "voss (released)", "vexxcerian", "rx (ran the serial)"]
    conflict:
      - id: "CF-02"
        value: "Vexx tells the review officer 'He had fragments. Physical evidence. I documented it in the field.' (ch-04:p03)"
        source: "ch-04:p03"
        against: "ch-03:p49 — 'He did not document the fragments of proof, still sitting untouched in the operator's gear.'"
        flag: "UNRESOLVED"
  modified-armour-plate:
    introduced: "ch-04:p09"
    description: "A scorched fragment of armour plating from the strike team. The modification pattern on its underside is subtle enough that a rushed field assessment could call it inconclusive, and clear enough under proper light that it plainly is not standard issue."
    status: "chekhov_open"
    last_mentioned: "ch-04:p09"
    resolution: null
    proves: "that the strike team's armour carried modifications of a kind only a handful of black programs get clearance for (Corwin's account, ch-03:p44)"
    does_not_prove: "which program, or whose"
    chain_of_custody: "see corwins-fragments"
  half-melted-data-chip:
    introduced: "ch-04:p09"
    description: "A half-melted data chip. Its contents are unrecoverable by anything short of a full forensics lab."
    status: "chekhov_open"
    last_mentioned: "ch-05:p37"
    resolution: null
    proves: "nothing in its current state"
    does_not_prove: "anything — unread, and unreadable with what Vexx has"
    chain_of_custody: "see corwins-fragments"
  dented-dog-tag:
    introduced: "ch-04:p09"
    description: "A single dented dog tag, NOT Corwin's, snagged on the collar of an armour piece that had belonged to nobody in his squad. Rx ran the serial: it does not come back clean — not flagged classified, simply absent, 'like it was never issued at all, or like the record was pulled after the fact.'"
    status: "chekhov_open"
    last_mentioned: "ch-05:p37"
    resolution: null
    proves: "that someone whose record does not exist was physically present at the ambush"
    does_not_prove: "who, or on whose orders. Resolving further needs a records system Rx does not have access to, and pulling that access would leave a trail (ch-04:p13). Vexx declined the risk: 'Not yet.'"
    chain_of_custody: "see corwins-fragments"
    developments:
      - { fact: "the stamped name is HOLST, D. — stamped rather than etched, the D worn shallower than the rest. Vexx has been reading it under a lamp at an angle for weeks", source: "ch-07:p24", status: "ON THE PAGE" }
      - { fact: "Staff Sergeant Deric A. Holst, 11th Shock Troops Battalion, KILLED IN ACTION, REMAINS NOT RECOVERED, FILE CLOSED — dead seven years and four months", source: "ch-07:p37", status: "ON THE PAGE" }
      - { fact: "a materiel issue record puts the same serial on a NEW set of identification tags and a torso plate issued to Holst ELEVEN MONTHS AFTER the file closed, routing MD 4, SUB. RECLAMATION", source: "ch-07:p45", status: "ON THE PAGE" }
      - { fact: "the tag was DROPPED, not planted — Corwin's surviving detail is a man coming off his line under fire to kneel by a body and put something in a hip pouch. Vexx: 'It had come off a man who went back for it and missed.'", source: "ch-06:p118", status: "ON THE PAGE" }
    reinterpretation:
      before: "carried for weeks as a thing left behind — planted, dropped as theatre, meant to be found (ch-06:p118)"
      after: "physical proof that a man whose record was closed seven years ago was issued equipment eleven months later and was standing in Corwin's ambush wearing it"
      turned_by: "ch-06 (Corwin's 'He was tidying') and ch-07 (the two archive lines, one under the other)"
      still_not_proven: "who Holst was working for, or any link whatever to Rx or to Jameson. Rx states it plainly: 'That's the whole of it. It isn't evidence of anything.' (ch-07:p33)"
  vexxs-private-file:
    introduced: "ch-04:p15"
    description: "The file Vexx keeps separately from anything that would ever cross Jameson's desk. As of Ch.4 it has one name in it: Corwin. 'Not evidence of anything yet. Just a thread, pulled loose, that he wasn't ready to let go of.'"
    status: "chekhov_open"
    last_mentioned: "ch-05:p37"
    resolution: null
  rxs-kia-notification-folder:
    introduced: "ch-01:p16"
    description: "The folder the two notification officers carried and never opened, held tighter against a dress blue chest each time Vexx asked again."
    status: "chekhov_open"
    last_mentioned: "ch-01:p19"
    resolution: null
    planned_developments:
      - { fact: "the four-year-old KIA notification carries a signature block — rank, name, authorising designation — that Vexx has owned the whole time and never read properly", source: "outline:ch-21", status: "NOT ON THE PAGE" }
  the-empty-casket:
    introduced: "ch-01:p22"
    description: "The casket buried at Rx's funeral, holding nothing. 'There's just a box shaped like an apology, and I'm standing here accepting it because there's nothing else on offer.' Declared motif: boxes that hold nothing."
    status: "background"
    last_mentioned: "ch-02:p71"
    resolution: null
  phantom-donor-consent-form:
    introduced: "ch-02:p23"
    description: "Spector's donor consent form, carrying a handwritten addendum at the bottom, in a place where donor forms are not supposed to have handwriting at all: 'For whoever needs it. Keep them from the dark.'"
    status: "chekhov_open"
    last_mentioned: "ch-02:p35"
    resolution: null
    note: "Vexx has read it. Goliath has NOT — Vexx deliberately withheld it as a story that belonged to Goliath to find on his own."
  corwins-dark-ai-chassis:
    introduced: "ch-03:p26"
    description: "Corwin's AI's chassis, sitting dark and unresponsive on his knee — 'powered down, or damaged, or something worse that none of them had a name for yet.'"
    status: "chekhov_open"
    last_mentioned: "ch-03:p26"
    resolution: null
  smashed-comms-array:
    introduced: "ch-03:p21"
    description: "A fragment of communications equipment from the burned camp, deliberately smashed rather than burned, so that no signal could ever go out of that clearing even after the fire went cold. Corwin destroyed it himself so nothing could be tracked back to a specific unit."
    status: "chekhov_closed"
    last_mentioned: "ch-03:p33"
    resolution: { chapter: 3, paragraph: 33, description: "Corwin explains it himself: he burned the camp and smashed the array so no one else would be dragged into it" }
  jamesons-commendation:
    introduced: "ch-04:p28"
    description: "The cell's response after Reyes was spared: 'Cell showed excellent judgment and restraint. Well done.' Signed, as always, with Jameson's name. Vexx read it twice looking for the thing underneath it and found only the same practised warmth."
    status: "background"
    last_mentioned: "ch-04:p29"
    resolution: null
  vexxs-sidearm-0300:
    introduced: "ch-01:p04"
    description: "The sidearm Vexx came out of sleep holding in both hands, sighted on his own bunk door, with Rx in the doorway. He did not lower it for two full seconds. The real reason for the discharge."
    status: "background"
    last_mentioned: "ch-01:p06"
    resolution: null

  merricks-notebook:
    introduced: "ch-08:p140 (as absent), recovered ch-08:p192"
    description: "Merrick's book — soft-covered, corners gone furred, a rubber band round the middle holding in a fold of loose paper. He kept it for years and could not produce it; the cell searched twenty minutes and did not find it. Aglaope recovered it after he was gone, from behind the fuse box on the shelf brackets, a place she had already looked twice."
    status: "chekhov_open"
    last_mentioned: "ch-08:p192"
    resolution: null
    chain_of_custody:
      - { stage: 1, holder: "merrick", where: "the plant house, location unknown to him", source: "ch-08:p140" }
      - { stage: 2, holder: "aglaope", where: "recovered from behind the fuse box, on the shelf brackets", source: "ch-08:p192" }
      - { stage: 3, holder: "vexxcerian", where: "squared to the edge of his desk beside the report pad", source: "ch-08:p192" }
    unresolved: "Vexx does not open it on the page. Nothing in Ch.8 states what is in it, and Merrick is already gone."
  holst-issue-record:
    introduced: "ch-07:p45"
    description: "ISSUE RECORD. MATERIEL, PERSONAL, CLASS 2. LINE 7 OF 22. Issued to HOLST, D. A., Staff Sergeant, 11th Shock Troops Battalion — TAG, IDENTIFICATION, SET OF TWO, QTY 1 SET, CONDITION: NEW; PLATE, TORSO, FRONT, CONDITION: SERVICEABLE, USED. ROUTING: MD 4, SUB. RECLAMATION. RETENTION: SEVEN YEARS. Dated eleven months after his casualty file closed."
    status: "chekhov_open"
    last_mentioned: "ch-07:p47"
    resolution: null
    proves: "that the serial on the tag in Vexx's drawer was re-issued after its owner was logged dead"
    does_not_prove: "who ordered it, who wore it, or any connection to Rx"
    note: >-
      Rx insists on the record, before Vexx reads it, that nothing was hidden: 'It's a materiel
      index. It exists so an auditor on a two-year cycle can confirm that a boot which left a
      store arrived somewhere with a foot in it. Nobody hid this.' Vexx can see line 7 of 22 and
      not the other twenty-one. RECLAMATION appears here UNGLOSSED, per outline:ch-07 — no
      character remarks on it and no narration underlines it.
  corwins-letters:
    introduced: "ch-06:p56"
    description: "Four letters Corwin has written to his daughter's mother. He does not know whether any of them left the building, and asks Vexx only whether a letter WENT — not what came back."
    status: "chekhov_open"
    last_mentioned: "ch-06:p78"
    resolution: null
    debt: "Vexx said 'I'll ask' and knew what it was worth on the way out of his mouth. Still unpaid at the end of Ch.8. He says it aloud to a stranger at a transit shelter — 'I don't know whether it went' — which discharges it emotionally and not at all practically."
  corwins-ai-casing:
    introduced: "ch-06:p50"
    description: "The casing of Corwin's dead AI, returned to him the week before Vexx's visit in a bag with his watch and his ring and everything else that was off his person on admission. Nothing was recovered off it — 'the word is unrecoverable.'"
    status: "chekhov_open"
    last_mentioned: "ch-06:p52"
    resolution: null
    note: >-
      Corwin refuses to say the AI's name inside the facility: 'I said it a lot in the trees...
      and somebody wrote that down, and it's in the file now under a heading. I'm not putting it
      in a room where it counts as a symptom.' The name is therefore withheld BY DESIGN through
      Ch.8 and must not be casually supplied later.
  the-visitor-log-signature:
    introduced: "ch-06:p60"
    description: "Vexx's own signature, third field, on the rehabilitation track's sign-out pad, handed to him by Voss. Retained two years. 'In a building he had no access to there was now a line with his name on one side of it and Corwin's on the other, in his own hand.'"
    status: "chekhov_open"
    last_mentioned: "ch-06:p64"
    resolution: null
    note: "The first deliberate shape Vexx has left behind him in four years. outline:ch-10 (Internal Compliance) is the nearest planned consumer."
  paladins-instrument-file:
    introduced: "ch-08:p54"
    description: "Eleven minutes of the same stringed-instrument training file — four strings, a woman's recorded voice saying 'and again, and this time listen to the second one' — that Paladin has been working since the middle of the summer. Bar three. It is not a different bar three."
    status: "background"
    last_mentioned: "ch-08:p62"
    resolution: null
  rxs-marksmanship-tally:
    introduced: "ch-07:p48"
    description: "Rx's private running count of Vexx's shooting: 'You're seventeen of thirty on the moving plates this month. I keep it. Nobody's asked me to keep it. I don't know what I keep it for.' Deployed badly timed, in the middle of the Holst discovery."
    status: "chekhov_open"
    last_mentioned: "ch-07:p48"
    resolution: null
    note: >-
      Planned for redeployment in outline:ch-13, mid-collapse. CONFLICT CF-11: character-bible
      TIC BUDGET reserves counting/tallying to SPECTOR alone. Recorded, not resolved.
  the-relay-hall-chain:
    introduced: "ch-08:p172"
    description: "The chain holding the relay hall's near door back on its hinge side — the reason the first man had to come round the frame rather than through it. A maker's stamp on the last link: four letters, then a number, then what might have been a second number under the paint. Goliath takes it off the cleat the next morning, frees the hinge pin with the fuel-shed spanner, and hangs the chain on the bracket where a chain goes."
    status: "background"
    last_mentioned: "ch-08:p190"
    resolution: { chapter: 8, description: "removed and coiled; the door swings. Nobody says anything while it is done." }
    note: "Vexx reads the maker's stamp while Paladin breaks down in front of him. It is a deflection, not a clue."

# ============================================================================================
# WORLD RULES
# ============================================================================================
world_rules:
  - { rule: "Valkyr's official paper trail is a bland subsection designation; the internal name is withheld even from new operators — 'Not Valkyr — not yet, not to him'", source: "ch-01:p54" }
  - { rule: "The program does not exist to fight the Covenant. It exists to watch the UNSC's own supersoldiers: to monitor, to judge, and to end, if the judgment comes back wrong", source: "ch-01:p55" }
  - { rule: "Elimination authority is issued as permission, never instruction — 'authorized, not obligated, to make the call the situation requires'. Nobody says 'the Choosing' out loud in the room", source: "ch-03:p02" }
  - { rule: "The word for it is 'the Choosing', lowercase in narration", source: "ch-03:p03" }
  - { rule: "Smart AIs are built from a dead human's mind; the Valkyr transfer can be authorized on-site in the field as a last measure", source: "ch-01:p39" }
  - { rule: "Donors sign a consent form before death; the form is standardised and is not supposed to carry handwriting", source: "ch-02:p23" }
  - { rule: "AI-operator pairings run through a neural interface and produce compatibility scores predicted in advance, which the actual bonding process does not reliably honour", source: "ch-02:p19" }
  - { rule: "Rx is 'a program of one' — he would not respond to, or run diagnostics for, three other candidates, and sat by every available measure entirely alone until Vexx entered the room", source: "ch-01:p46" }
  - { rule: "Classified KIAs are buried with an empty casket: remains unable to be recovered from the field", source: "ch-01:p22" }
  - { rule: "ONI rotates faces through sensitive rooms so no single person accumulates too clear a picture of anything", source: "ch-04:p02" }
  - { rule: "Cells are built from the discarded — people already erased, overlooked, or handed a designation instead of a name", source: "ch-02:p71" }
  - { rule: "Evidence released from evidence lock can be pulled on an authorization tied to a single cell, which does not flag on a wider report", source: "ch-04:p08" }
  - { rule: "Pulling records access without authorization leaves a trail", source: "ch-04:p13" }
  - { rule: "Valkyr AIs are drawn from the same elite donor stock as SPARTAN-II AI pairings, meaning any Valkyr AI could be a genetic sibling to a SPARTAN-II's AI. NOT PUBLICLY KNOWN; not yet on the page", source: "series-bible" }
  - { rule: "Two known AI origin types: twin/soul-bond (Rx) and willing pre-death donation (Spector, and presumably others)", source: "series-bible" }
  - { rule: "NO RAMPANCY CLOCK, in any form, in any book. AI instability is memory suppression, trauma and moral weight only", source: "series-bible" }
  - { rule: "Operators work in isolated cells with no contact between cells, insulated from the command tier that issues elimination orders. NOT YET DRAMATIZED on the page", source: "series-bible" }
  - { rule: "Rx's memory of the event that killed him is sealed; the seal is not static and degrades under (1) proximity or reference to Jameson and (2) Vexx's investigation closing in externally", source: "series-bible" }
  - { rule: "No absolute in-universe date may be pinned to the page. Era: early-to-mid Human-Covenant War", source: "series-bible" }

# ============================================================================================
# ORGANIZATIONS
# ============================================================================================
organizations:
  valkyr:
    canonical_name: "Valkyr"
    aliases: ["the program", "the rebuilt Valkyr"]
    facts:
      - { fact: "the name is not given to Vexx at recruitment — only a subsection tag meaning nothing on its own", source: "ch-01:p54" }
      - { fact: "described to Vexx as 'specialized asset recovery and monitoring, operating outside standard chains of command, answerable to a command structure he wouldn't be introduced to for several more weeks'", source: "ch-01:p54" }
      - { fact: "Corwin knows the name and knows what it means — 'the ghosts... the ones who watch. The ones who decide'", source: "ch-03:p31" }
      - { fact: "was rebuilding and expanding beyond a single operator and his AI when Vexx was brought in", source: "ch-01:p66" }
      - { fact: "the cell Vexx built is the first full cell the rebuilt program has fielded", source: "ch-02:p74" }
      - { fact: "NEVER write 'Valkyrie' or 'Valkyr Program' as a formal title", source: "series-bible" }
  vexxs-cell:
    canonical_name: "the cell (unnamed)"
    aliases: ["the first full cell", "this cell"]
    facts:
      - { fact: "commissioned as five operators and five AI selected by Vexx from a pre-screened shortlist, with Vexx holding final say; command wanted it operational within the quarter", source: "ch-02:p15" }
      - { fact: "final composition on the page: Vexx/Rx, Goliath/Spector, Gaia/Echo, Paladin/Bastion, Zeus/Hollow, Aglaope/Requiem — six operators and six AI", source: "ch-02:p72" }
      - { fact: "deployments depicted: 1st = the jungle world (Ch.3), 3rd = the Reyes settlement (Ch.4). The 2nd is never depicted", source: "ch-04:p16" }
      - { fact: "Vexx is not formally in command at selection — 'Not command, not yet — just a seat at the table'", source: "ch-01:p66" }
    conflict:
      - id: "CF-06"
        value: "'six pairings into a roster he'd built with his own hands' (ch-02:p60)"
        source: "ch-02:p60"
        against: "Vexx built five pairings; his own pairing with Rx was made for him before the cell existed (ch-01:p46)"
        flag: "UNRESOLVED"
  oni:
    canonical_name: "ONI"
    aliases: []
    facts:
      - { fact: "released Vexx with 'the kind of quiet efficiency ONI reserved for assets that had become liabilities'", source: "ch-01:p07" }
      - { fact: "senior officers have access to longevity treatments", source: "ch-02:p02" }
      - { fact: "runs intelligence units whose interrogation methods get flagged by internal review and not stopped", source: "ch-02:p55" }
      - { fact: "NEVER write 'O.N.I.'", source: "series-bible" }
  unsc:
    canonical_name: "UNSC"
    aliases: []
    facts:
      - { fact: "the parent military; dress uniform is the vehicle for a KIA notification", source: "ch-01:p16" }
      - { fact: "a strike team wearing UNSC signatures — modified armour plating, UNSC tactical shorthand, matching no deployment on record — ambushed Corwin's squad", source: "ch-03:p44" }
      - { fact: "NEVER write 'U.N.S.C.'", source: "series-bible" }
  spartan-ii:
    canonical_name: "SPARTAN-II"
    aliases: ["Spartan (as a common noun on the page)"]
    facts:
      - { fact: "Vexx and Rx entered at age six as twins — same baseline, same augmentation windows, tracked as a matched pair rather than two variables", source: "ch-01:p10" }
      - { fact: "every discipline is cross-trained in field demolition at some level", source: "ch-03:p21" }
      - { fact: "operators are the objects of Valkyr's charter, not its staff", source: "ch-01:p55" }
      - { fact: "NEVER write 'Spartan-2' or 'SPARTAN II'", source: "series-bible" }
  the-covenant:
    canonical_name: "the Covenant"
    aliases: []
    facts:
      - { fact: "the war the program pointedly does not exist to fight", source: "ch-01:p55" }
      - { fact: "a Covenant raid wrecked the agricultural settlement weeks before the cell arrived, and killed the squad Reyes was grieving", source: "ch-04:p18" }
      - { fact: "Series canon: the Human-Covenant War runs in the background of both books. Open author decision: pressure the cell feels, or scenery they pass", source: "series-bible" }

# ============================================================================================
# SECRETS — the asymmetric-knowledge engine. Who knows what, as of the end of Ch.5.
# ============================================================================================
secrets:
  rx-was-murdered:
    statement: "Rx did not die in combat. He refused a Choosing order and was killed as a cleanup action disguised as hostile contact. Jameson gave the order and carried it out personally, and Rx's death is the hinge of his promotion."
    canonical_source: "series-bible"
    state_at_end_of_ch5: "SUSPECTED BY ONE MAN, SPOKEN ALOUD TO ONE OTHER. Not proven, not acted on."
    state_at_end_of_ch8: >-
      UNCHANGED IN KIND, HARDER IN SUBSTANCE. Vexx now holds a physical anomaly he can date
      (Holst's tag re-issued eleven months after his file closed, ch-07) and a reinterpretation
      of how the tag reached the ground (ch-06). He has still named Jameson to exactly one
      person, still taken no action, and still not pulled the records access that would leave a
      trail. Nobody new has been told. Rx has still not connected his fragments to anything.
    who_knows:
      richard-jameson:
        level: "full — he did it"
        source: "series-bible; ch-02:p08"
        note: "believes it died with Rx. Does NOT know Rx survived as an AI (ch-05:p37). See characters.richard-jameson.does_not_know for the open mechanism question."
      rx:
        level: "sealed — he lived it and cannot reach it"
        source: "ch-04:p39"
        note: "Has fragments only: a treeline he has no file for and a voice he cannot place (ch-03:p37); his own voice in 'the shape of a refusal' (ch-04:p36). He has NOT connected them to Jameson, and has told Vexx he does not remember. He knows he is carrying something — 'I'm working on being ready' (ch-05:p36)."
      vexxcerian:
        level: "suspicion, unacted"
        source: "ch-05:p24"
        note: >-
          Believes an order was given, refused, and buried. Points toward Jameson but has not
          said the name first himself — Aglaope said it and he did not correct her (ch-05:p27).
          Has physical evidence that proves someone unrecorded was at the Corwin ambush, and
          nothing that connects it to Rx. Has chosen NOT to pull the records access that would
          resolve the serial, because it would leave a trail (ch-04:p13). Has taken no action
          against Jameson and has not reported anything.
      aglaope:
        level: "the suspicion in outline, not the evidence"
        source: "ch-05:p24"
        note: "Told by Vexx directly. Named Jameson herself. Was NOT given the dog tag by name and was NOT given Rx's memory fragments in full (ch-05:p32). Asked to keep it, and agreed."
      gaia:
        level: "that Vexx suspects something, and nothing else"
        source: "ch-05:p16"
        note: "Holds a promise that she will be the first told when it becomes more than suspicion."
      voss:
        level: "adjacent only"
        source: "ch-04:p08"
        note: "Knows Vexx pulled Corwin's fragments out of evidence lock and chose not to stop him. Does NOT know why, and did not ask. Series canon assigns her no knowledge of the Rx thread."
      goliath: { level: "none", source: "series-bible" }
      paladin: { level: "none", source: "series-bible" }
      zeus:    { level: "none", source: "series-bible" }
      corwin:  { level: "none of the Rx thread; holds the parallel truth about his own ambush and is not believed", source: "ch-04:p02" }
      spector: { level: "none", source: "series-bible" }
      echo:    { level: "none — but was present for the Gaia corridor exchange", source: "ch-05:p16" }
      bastion: { level: "none", source: "series-bible" }
      hollow:  { level: "none", source: "series-bible" }
      requiem: { level: "unrecorded — Aglaope is not shown telling her", source: "ch-05:p32" }
  rx-runs-hot-on-certain-words:
    statement: "Spector has observed that Rx takes measurably longer over a small handful of words when they cross the net — a fraction of a second, then he is exactly what he was before it. Two of the three words Spector named are 'unstable' and 'refused'."
    canonical_source: "ch-08:p196"
    state_at_end_of_ch8: "HELD BY THREE PARTIES, ROUTED ONCE, DELIBERATELY NOT ESCALATED"
    who_knows:
      spector:
        level: "the observation itself, including all three words"
        source: "ch-08:p196"
        note: "Chose NOT to put it through maintenance telemetry and NOT to take it to Vexx directly. He went to his own operator."
      goliath:
        level: "the observation, and two of the three words"
        source: "ch-08:p198"
        note: "Delivered it to Vexx plainly, once, in a corridor, and asked one question — 'Do you want the third one, when he gives it to me?' — and let the non-answer stand."
      vexxcerian:
        level: "the observation, and two of the three words. NOT the third."
        source: "ch-08:p198"
        note: >-
          INFORMATION-FLOW ANCHOR. This is the ONLY route by which Vexx learns that a party
          outside himself has noticed Rx. Everything he knew before this came from Rx directly
          (ch-01:p62, ch-03:p37, ch-04:p36) or from his own observation. He deflects — 'It's
          the water' — and does not answer Goliath's question. No later chapter may assume he
          holds the third word, and no earlier chapter supplies this to him.
      rx: { level: "unknown — he is not shown being told, and does not raise it", source: "ch-08:p198" }
      gaia: { level: "none", source: "ch-08:p196" }
      paladin: { level: "none", source: "ch-08:p196" }
      zeus: { level: "none", source: "ch-08:p196" }
      aglaope: { level: "none", source: "ch-08:p196" }
      richard-jameson: { level: "none", source: "ch-08:p196" }

  phantom-saved-goliaths-homeworld:
    statement: "The Spartan who ended the threat to Goliath's childhood colony and the donor behind Goliath's AI are the same man."
    canonical_source: "series-bible"
    state_at_end_of_ch5: "SUSPECTED BY GOLIATH, NEVER CONFIRMED. Delivered exactly as canon requires — not from a record, but because Spector let it slip."
    who_knows:
      goliath: { level: "suspects; 'didn't sound entirely convinced it was coincidence'", source: "ch-02:p44" }
      spector: { level: "handed over the name and then went careful", source: "ch-02:p38" }
      vexxcerian: { level: "saw Goliath go quiet, did not hear the exchange, made a note to ask and never did", source: "ch-02:p45" }
  the-donor-addendum:
    statement: "Phantom's consent form carries a handwritten line: 'For whoever needs it. Keep them from the dark.'"
    canonical_source: "ch-02:p23"
    state_at_end_of_ch5: "KNOWN TO VEXX, DELIBERATELY WITHHELD FROM GOLIATH"
    who_knows:
      vexxcerian: { level: "full; chose not to mention it — 'That story belonged to Goliath to find on his own time'", source: "ch-02:p35" }
      rx: { level: "full; read the donor file and used it to argue for Goliath's selection", source: "ch-02:p22" }
      goliath: { level: "none", source: "ch-02:p35" }

# ============================================================================================
# MEMORY UNLOCK LADDER — locked four-stage structure (series-bible). Book One may reach 3.
# ============================================================================================
memory_unlock_ladder:
  canonical_source: "series-bible"
  stage_1:
    definition: "First leak — an unexplained flash (name/image) during a routine op. Unsettling, not yet legible."
    status: "SPENT"
    on_the_page: "ch-03:p37"
    what_surfaced: "a treeline that is not this treeline and that he has no file for, plus a voice he could not place, giving an order. Triggered by Corwin's line 'the ones who watch, the ones who decide.'"
    vexx_response: "wanted to push; did not. Filed it away (ch-03:p40)"
    rx_response: "'I'm fine' — too quick (ch-03:p39). Then, on the transport home, states he believes it was a memory, his, from before, and sounds afraid for the first time (ch-03:p53, ch-03:p56)"
  stage_2:
    definition: "Second leak — a fragment of sound/emotion; Rx hears his own voice refusing the order. Surfaces as a glitch Vexx notices and Rx deflects."
    status: "SPENT"
    on_the_page: "ch-04:p36"
    what_surfaced: "his own voice, not saying anything he remembers saying — not words yet, 'just the shape of a refusal.' Occurred twice in one day: once during the briefing when Jameson's name came up, once while talking about Paladin standing his ground."
    vexx_response: "asked directly — 'Do you remember anything at all about how you actually died?' (ch-04:p37)"
    rx_response: "'No... Something in me won't let me get close enough to look.' Vexx believed him, and also registered it as not quite a lie and not quite the whole truth (ch-04:p39)"
  stage_3:
    definition: "Third leak — triggered specifically by Jameson's presence/voice. Proximity to Jameson becomes narratively dangerous for Rx."
    status: "NOT REACHED"
    planned_for: "outline:ch-13 (Proximity) — Jameson's voice on the open channel at close range; Rx comes apart in contact; Vexx loses two seconds of interface and almost gets shot; Vexx lies to the cell for the first time to cover for him"
    precursors_already_on_the_page:
      - { event: "the half-syllable catch on Jameson's name in a command-structure briefing", source: "ch-01:p62" }
      - { event: "Rx silent through the entire first Jameson meeting; a cursor hitching on Jameson's voice 'the way skin flinches from a burn it can't consciously remember getting'", source: "ch-02:p14" }
      - { event: "Rx silent again through Jameson's first mission briefing", source: "ch-02:p75" }
      - { event: "Rx goes held-breath still at Corwin's description of the clean kill order", source: "ch-03:p46" }
      - { event: "one of the two stage-2 triggers was Jameson's name in a briefing", source: "ch-04:p36" }
      - { event: "Rx goes wholly silent for the length of the Corwin visit — 'Rx did not say anything. He had not said anything since the corridor.' No content surfaces; Vexx notes it and sits with it", source: "ch-06:p46" }
      - { event: "Rx produces a FALSE shared childhood memory — rain on a tin roof at the second barracks the summer they were fifteen — breaks off mid-simile, and covers with 'Queue's moved.' The narration corrects him in one flat line: 'The barracks roof had been concrete.' Vexx does not challenge it", source: "ch-07:p20" }
      - { event: "Spector, independently, has clocked Rx running hot on 'unstable' and 'refused' and one further word; routed to Vexx through Goliath. First EXTERNAL corroboration that Rx is not behaving normally", source: "ch-08:p196" }
    ch6_8_audit_2026_09_09: >-
      VERIFIED: Chapters 6, 7 and 8 spend NO unlock stage and duplicate neither stage 1 nor
      stage 2. Nothing legible surfaces to Rx; no new fact reaches Vexx from inside Rx; Jameson
      is not present in person in any of the three chapters. Stage 3 remains NOT REACHED and
      unclaimed for outline:ch-13.
      TWO STANDING CAUTIONS: (a) ch-07's confabulated tin roof is a NEW class of Rx malfunction
      that the four-stage ladder does not describe. It must be read as suppression bleeding into
      adjacent memory, NEVER as decay-over-time — it sits closer to a rampancy tell than
      anything else in the drafted book and series canon forbids that reading. (b) Jameson has
      now been in a room with Vexx and Rx twice on the page without incident (ch-02:p04,
      ch-03:p03), so 'Jameson present in person' is by itself no longer a novel trigger.
      outline:ch-13 must escalate the trigger explicitly — his VOICE, close, on an open channel,
      giving a live instruction — which is what the outline already specifies. Do not weaken it.
  stage_4:
    definition: "Full unlock — forced by Vexx confronting Rx directly with external evidence."
    status: "FORBIDDEN IN BOOK ONE"
    planned_for: "Book Two, at or just before the climax"
    note: "outline:ch-20 (Ashgrove) delivers stage-3 RESIDUE only — a place name, a fragment of the refusal, and the structural fact that it was not combat. No face, no name, no rank, no date."

