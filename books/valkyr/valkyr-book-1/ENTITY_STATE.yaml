    ch6_additions:
      physical:
        - { value: "weight back on; the face has corners in it and colour; the eyes have come forward; hair clipped without much interest in the result; soft grey clothes", source: "ch-06:p48" }
        - { value: "handshake measurably better than in the jungle", source: "ch-06:p224" }
      traits:
        - { trait: "the grammar-correction reflex, now on the page — 'Were.' 'It came out of Corwin flat and fast, like a hand going out after a dropped cup', and he is embarrassed by the reflex rather than by the grammar", source: "ch-06:p88", mutable: false }
        - { trait: "the Ch.3 anchor supplied as memory: on Paladin's back at two in the morning, 'There were fewer of them than the report says. Not less.' Never written down", source: "ch-06:p96", mutable: false }
        - { trait: "has a nine-year-old daughter; four letters written, none confirmed sent; asks only whether a letter WENT, not what came back", source: "ch-06:p56", mutable: false }
