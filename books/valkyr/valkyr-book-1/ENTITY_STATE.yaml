        content: >-
          Head injury from a helmet-seal fracture logged only as impact; two days drinking off
          leaves; the recovery element that came in was UNSC and he mistook it for the strike
          team that killed his squad; he charged their stores and put his boot through the array
          and evaded them for eight days; the 'modified plating' was ordinary plating burned by
          plasma contact; the UNSC shorthand was UNSC shorthand because they were UNSC.
        source: "ch-06:p110"
        holds_it_sincerely: true
        evidence_he_cites: "the recovery element's log, the medical, the timeline put in front of him twice by two people with no reason to agree, and the fact that nobody there has argued with him once"
        vexx_does_not_believe_it: "ch-06:p120"
      location_log_addition:
        - { chapter: 6, location: "rehabilitation-station", scene: "the day room, six weeks in, lucid and well and grateful", travel_noted: false }
      knowledge_addition:
        - { fact: "that his own account was wrong and that holding to it against the record is the illness", learned: "before ch-06:p110", method: "told_by:institution" }
        - { fact: "that Aglaope's name is Aglaope", learned: "ch-06:p60", method: "told_by:vexxcerian" }
      note: "CF-04 CLOSED by this chapter. needs_review cleared 2026-09-09."
    arc_notes: "Series canon: alive at the end of Book One, reassigned to a rehabilitation track, holding a truth nobody believes. Not killed — edited."

