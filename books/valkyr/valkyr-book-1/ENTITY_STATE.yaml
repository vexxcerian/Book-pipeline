  # ------------------------------------------------------------------------------------------
  # Added 2026-10-03 from Ch.9-11.
  # ------------------------------------------------------------------------------------------
  dessen:
    canonical_name: "Dessen"
    aliases: ["Officer Dessen", "Internal Compliance"]
    never_spelled: ["Dessin", "Desen"]
    importance: "secondary"
    on_page: "Ch.10 — the whole chapter. Named at ch-10:p22 ('Operator Vexxcerian. Dessen, Internal Compliance.'). No first name, no rank beyond 'Officer'"
    physical:
      - { fact: "right-handed; writes longhand at about ninety words a minute without lifting the pen at the ends of the words, with her left hand holding the book open", source: "ch-10:p20, ch-10:p92" }
      - { fact: "carries a cloth-spined bound paper notebook with a corner gone soft, in a case with a strap set for somebody else's shoulder and never changed", source: "ch-10:p20, ch-10:p262" }
    traits:
      - { trait: "DEVICE (character-bible, hers alone): the same question three times with one word changed — 'What was the material required for' / 'What was the material used for' / 'What is the material being used for' — and writes all three answers down, one under the last, drawing no line between them", source: "ch-10:p66-p90", mutable: false }
      - { trait: "not hostile and not theatrical. No folder pushed across the table, no pause held for effect. Offers Vexx the finding before asking him anything, and offers him the option not to hear it", source: "ch-10:p26, ch-10:p40" }
      - { trait: "tells Vexx the water has been standing since yesterday and that she would have it anyway", source: "ch-10:p60" }
      - { trait: "pens die at the tail; she buys them by the gross and says so mid-interview", source: "ch-10:p124" }
      - { trait: "writes down Jameson's apology at exactly the speed she wrote down his insult, in the same hand — 'the only thing in that room, from first to last, that treated the two of them as the same size'", source: "ch-10:p182" }
      - { trait: "concedes an argument on the merits and says so out loud: 'That's better than I had it'", source: "ch-10:p206" }
    relationships:
      - { to: "vexxcerian", relation: "investigator / subject. Puts on the page that she will record 'you don't recall' because he does not, 'and if it turns out later that you do, that'll be a different conversation, a worse one'", source: "ch-10:p60" }
      - { to: "richard-jameson", relation: "never met before Ch.10. He interrupts her mid-sentence, insults her work for eight seconds, then apologises for four specific things. She files the apology in the margin", source: "ch-10:p150-p184" }
    knowledge:
      - { fact: "that the Corwin material was released on an authorisation Vexx raised and countersigned, drawn in person off the counter, and never returned", learned: "ch-10 (her own three-week investigation)", method: "documentary" }
      - { fact: "that Vexx fabricated a logged extension and retracted it inside a minute", learned: "ch-10:p122", method: "he told her" }
      - { fact: "that the review board struck the material from the evidentiary record and retained it as property pending disposal, three weeks(sic) before Vexx signed", learned: "ch-10:p222", method: "Jameson told her where to read" }
    does_not_know:
      - { fact: "that Vexx suspects Jameson, or that the material is anything other than a chain-of-custody problem", source: "ch-10 — nothing in the chapter touches it" }
      - { fact: "the lock clerk's name. Vexx withheld it and she declined to pursue it", source: "ch-10:p60" }
    outcome:
      - "The FINDING stands, unamended. The RECOMMENDATION (fitness-to-hold-operational-command review) falls away."
      - "A property return notice is due to Vexx 'inside a fortnight'. Vexx says 'I will' to answering it the same day; she answers 'People say that'. SEE CF-19 — Ch.11 has him concealing that property instead."
    arc_notes: >-
      Series-bible: 'Survives; pressure from the system, deliberately NOT from Jameson.' The
      prose honours it exactly — she is correct throughout and never once an antagonist.
      PLANT, unconsumed: she asks Vexx whether he knows anybody in operational support, and
      says the transfer board has twice told her her experience is very valuable where it is.
      No outline chapter picks this up. See CF-24.
      SHOULD BE PROMOTED in SERIES-BIBLE.md from 'not yet on the page' to the cast tables.
  beattie:
    canonical_name: "Mr. Beattie"
    aliases: []
    importance: "minor"
    on_page: "Ch.9 — named once, never appears, never speaks"
    traits:
      - { trait: "does the night urn at the home station; has been on the station longer than Zeus and Vexx put together. Named by Zeus to correct Vexx, who had offered 'Hallam'", source: "ch-09:p36" }
    knowledge: []
    arc_notes: >-
      Exists to make one point about Vexx: he does not know the name of the man who makes the
      coffee he drinks at two in the morning. Do not give him a scene.
      NOTE THE COLLISION HE CREATES: see CF-20 (Hallam).
  curran:
    canonical_name: "Curran"
    aliases: []
    importance: "minor"
    on_page: "Ch.9 — named once, in Aglaope's account. Never appears, never speaks"
    traits:
      - { trait: "the one man on Aglaope's list who lived. Came back off the table, was flown out, and wrote to her four years ago about a boat he was buying", source: "ch-09:p218" }
    knowledge: []
    outcome: "Aglaope spends from half past two deciding whether to take him off the list. Vexx says 'Leave him on.' She says that is what she will do, in the voice of somebody agreeing to a thing she had already decided."
    arc_notes: >-
      He is the load-bearing entry on the list: 'if he's on it, then what I do is sit with
      people. And if he isn't, then what I do is something else, and I've been doing it for
      eleven years.' Do not resolve him, do not bring him on stage, do not kill him later to
      make a point.
  ansel-and-anseth:
    canonical_name: "Ansel and Anseth"
    aliases: []
    importance: "minor"
    on_page: "Ch.9 — named once, as a pair, in Aglaope's account. Never appear, never speak"
    traits:
      - { trait: "two names nine pages apart on Aglaope's chronological list. They came off the same ramp within a minute of each other into the same field, and Ansel took an hour and forty minutes longer to die. She was there for all of it", source: "ch-09:p212" }
    knowledge: []
    arc_notes: >-
      The reason Aglaope refuses to alphabetise: 'If I put those two side by side on a list,
      that hour and forty minutes stops existing. It only exists because they're nine pages
      apart.' The near-identical spelling is the POINT and must be preserved exactly as
      "Ansel" and "Anseth". Add both to the SERIES-BIBLE registry so no later pass
      "corrects" one into the other.
  the-boots-owner:
    canonical_name: "(the owner of the boot — DELIBERATELY NEVER IDENTIFIED)"
    aliases: []
    importance: "minor"
    on_page: "Ch.11 — referred to, never named, never seen"
    traits:
      - { trait: "props the fire door at the bottom with a single left boot, standard issue, laces gone and cord through the eyelets, sole gone smooth at the ball. Re-props it after Gaia shuts it, twice", source: "ch-11:p40-p42" }
      - { trait: "Gaia has asked around: 'It hasn't got an owner.' Goliath's read: 'Whoever's doing it isn't doing it for air... A boot at the bottom is what you use when you want to come through it fast and not stop'", source: "ch-11:p50, ch-11:p64" }
    knowledge: []
    arc_notes: >-
      HARD CONSTRAINT, verified clean through Ch.11: nobody identifies them and no narration
      narrows the field. Vexx takes the boot and keeps hold of it; the chapter ends with the
      boot still in his hand and the owner still unknown. NO LATER CHAPTER MAY NAME THEM.
      Possible deliberate resonance with ch-07's cold open (ISSUE RECORD: 'BOOT, COLD WEATHER,
      PAIR. LINE 41 OF 60' / Rx: 'Those are boots') — left unglossed in both places, which is
      correct. Do not connect them on the page.

