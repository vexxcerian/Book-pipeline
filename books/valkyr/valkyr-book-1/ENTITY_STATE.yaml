    audit. Ch.11 had NOT been through its polish loop when this pass ran and is recorded as a
    first draft; entries sourced from it carry draft_status: "ch-11 pre-polish".
    Same principle as the 2026-09-09 pass: only entries where the manuscript is unambiguous
