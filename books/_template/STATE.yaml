project:
  title: "<BOOK TITLE>"
  genre: "<genre>"
  subgenre: "<subgenre>"
  language: "English"
  word_count_target: 90000
  comp_titles: []
  engagement_type: {primary: "", secondary: "", tertiary: ""}
  premise: "<one-sentence premise>"
  created: "<YYYY-MM-DD>"
  updated: "<YYYY-MM-DD>"

# RUN MODE. Two shapes:
#   "genesis-from-idea"     — no prior draft; architect builds everything from the premise.
#   "revise-existing-draft" — source prose staged in research/; the loop revises to the roadmap.
adaptation:
  mode: "revise-existing-draft"
  canon_sources:
    # Fill these in once source material is staged into research/:
    original_draft:  "research/original-draft.txt"   # raw prose to revise/expand
    # series_roadmap:  "research/series-roadmap.md"
    # character_bible: "research/character-bible.md"
    # chapter_roadmap: "research/chapter-roadmap.md"   # scene-by-scene plan (binding outline)
    # master_checklist:"research/master-checklist.md"
  chapter_1_locked: false        # set true if Ch.1 is a hand-finished voice benchmark
  chapters_to_produce: []        # e.g. [2,3,...,N]

word_floor:
  manuscript_min_words: 85000    # HARD FLOOR (book total) — the binding gate; adjust per book.
  manuscript_target_words: 90000 # architect budgets Σ chapter targets ≥ this (see book-architect §0.5).
  # NOTE: there is deliberately NO uniform per-chapter floor. Chapter lengths VARY WIDELY
  # (~1,500–7,000w) by design — the book TOTAL is what's enforced, not each chapter. A
  # per-chapter minimum would recreate the uniform ~5k/20-chapter "AI-neat" shape.
  shortest_chapter_floor: 1200   # sanity floor for the SHORTEST allowed chapter (punch chapters ok; not a target)

phase:
  current: 1
  # ⚠️ PLACEHOLDER — this default is a lie until you update it. The moment source
  # material lands in research/ (or elsewhere), OR the architect runs, REWRITE this
  # line to name the actual staged material and the true next step. Do NOT trust a
  # status that still reads "TEMPLATE DEFAULT" — check the files (research/,
  # foundation.md/outline.md at root OR under project/, feedback/progress.md).
  status: "TEMPLATE DEFAULT (update me) — freshly scaffolded, no source staged yet; awaiting source material in research/, then architect"
  history: []

chapters:
  total_planned: 0
  completed: []
  scores: {}

genesis_score:
  current_floor: 0.0
  current_average: 0.0

quality_gate:
  chapters_passed: []
  chapters_escalated: []

guardrails:
  - "Genesis Floor >= 8.5 per chapter (book-evaluator); polish-loop via book-editor (max 5)."
  - "Style gate: python3 tools/style_check.py must stay clean (simile <=4/1k, em-dash <=~10/1k, no NEW cross-chapter repeated phrase, tics under ceiling). Add this book's deliberate motifs to ALLOWLIST in tools/style_check.py."
  - "Word floor >= manuscript_min_words; verify with: wc -w manuscript/chapters/chapter-*.md."
  - "Revise/expand the original draft to the roadmap; do NOT invent from scratch. Match the locked Ch.1 voice if one exists."
  - "<add this book's settled canon guardrails here>"

open_author_decisions:
  - "<list any plot/character decisions the author must make before drafting>"

# character-bible.md is a REQUIRED architect deliverable (see docs/CHARACTER-BIBLE.md).
character_bible:
  created: false
  entries: 0          # named characters carrying a voice card + DISTINCTNESS GUARANTEE
  tic_bearers: []     # the <=2-3 characters allowed to LEAD with a verbal tic

# SERIES — delete this block for a standalone book. See docs/SERIES.md.
# series:
#   name: "<Series Name>"
#   position: 1                       # publication order
#   bible: "../SERIES-BIBLE.md"       # canon shared by every book in the series
#   previous_book: "../<prev-slug>"   # carry forward character-bible.md + ENTITY_STATE.yaml
#   carry_forward: [character-bible.md, ENTITY_STATE.yaml, voice-dna.md]

decisions:
  - "This book is a folder under books/<slug>/ in the Books monorepo, using the shared root pipeline."
revision_cycles: 0
